<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Verificar Guerreiro</title>
  </head>
  <body>
    <h1>Você é um guerreiro?</h1>
    <button onclick="verificarGuerreiro()">Verificar</button>

    <script>
      function verificarGuerreiro() {
        let estuda = confirm("Você estuda? (OK = Sim / Cancelar = Não)");
        let trabalha = confirm("Você trabalha? (OK = Sim / Cancelar = Não)");

        if (estuda && trabalha) {
          alert("Você é guerreiro!");
        }
      }
    </script>
  </body>
</html>
