<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Verificar Voto</title>
  </head>
  <body>
    <h1>Verificador de Direito ao Voto</h1>
    <button onclick="verificarIdade()">Verificar</button>

    <script>
      function verificarIdade() {
        let idade = prompt("Digite sua idade:");

        idade = Number(idade);

        if (isNaN(idade) || idade < 0) {
          alert("Por favor, digite uma idade válida.");
          return;
        }

        if (idade >= 16) {
          alert("Você pode votar.");
        } else {
          alert("Você ainda não pode votar.");
        }
      }
    </script>
  </body>
</html>
