<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Turno</title>
  </head>
  <body>
    <script>
      const turno = prompt(
        "Qual o seu turno? (M - Matutino, V - Vespertino, N - Noturno):"
      );

      if (turno.toUpperCase() === "M") {
        alert("Bom dia!");
      } else {
        if (turno.toUpperCase() === "V") {
          alert("Boa tarde!");
        } else {
          if (turno.toUpperCase() === "N") {
            alert("Boa noite!");
          } else {
            alert("Valor inválido!");
          }
        }
      }
    </script>
  </body>
</html>
