<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Confirmar Ação</title>
  </head>
  <body>
    <script>
      const continuar = confirm("Deseja continuar?");

      if (continuar) {
        alert("Você escolheu continuar.");
      } else {
        alert("Operação cancelada.");
      }
    </script>
  </body>
</html>
