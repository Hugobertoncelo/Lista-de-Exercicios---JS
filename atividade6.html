<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Verificar se Pode Dirigir</title>
  </head>
  <body>
    <h1>Verificador de Habilitação</h1>
    <button onclick="verificarSePodeDirigir()">Verificar</button>

    <script>
      function verificarSePodeDirigir() {
        let idade = prompt("Digite sua idade:");
        idade = Number(idade);

        if (isNaN(idade) || idade < 0) {
          alert("Idade inválida.");
          return;
        }

        let temCarteira = confirm(
          "Você tem carteira de motorista? (OK = Sim / Cancelar = Não)"
        );

        if (idade >= 18 && temCarteira) {
          alert("Você pode dirigir.");
        } else {
          alert("Você NÃO pode dirigir.");
        }
      }
    </script>
  </body>
</html>
